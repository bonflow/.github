name: label-sync
on:
  push:
    branches: [main]
    paths: [labels.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [bonflow-server, bonflow-app]
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2   # pin to a commit SHA
        with:
          config-file: labels.yml
          token: ${{ secrets.LABEL_SYNC_TOKEN }}
          request-token: ${{ secrets.LABEL_SYNC_TOKEN }}
          repository: bonflow/${{ matrix.repo }}
          delete-other-labels: true
